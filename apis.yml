name: USAA
kind: company
description: >-
  USAA (United Services Automobile Association) is a Fortune 100 financial
  services group offering banking, investing, and insurance products exclusively
  to people and families who serve, or have served, in the United States
  military. USAA does not publish a first-party public developer portal or
  downloadable API specifications. Third-party access to member financial data
  is delivered through consumer-permissioned open-banking aggregators — Plaid,
  Mastercard Open Banking (formerly Flinks), and BankSync — using OAuth 2.0
  tokenized authorization rather than shared credentials. USAA is an active
  member and board participant of the Financial Data Exchange (FDX) and helps
  shape the FDX API standard for secure open finance data sharing in the US.
