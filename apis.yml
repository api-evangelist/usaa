apis:
- aid: usaa:open-banking-aggregation
  name: USAA Open Banking via Aggregators
  description: >-
    USAA exposes member-permissioned financial data — account metadata, current
    and available balances, and transaction history for checking, savings,
    credit, and investment accounts — through consumer-permissioned open-banking
    aggregators rather than a first-party public API. Documented access paths are
    Plaid, Mastercard Open Banking (formerly Flinks), and BankSync, each of which
    maintains its own developer portal, credentials, and normalized data model.
    Authorization follows the OAuth 2.0 / FDX pattern in which members grant
    scoped, tokenized access to authorized third parties without sharing USAA
    usernames or passwords. USAA does not publish OpenAPI or Swagger definitions;
    the contract surface is defined and governed by each aggregator and by the
    FDX API specification USAA aligns to.
  humanURL: https://www.usaa.com
