- aid: usaa:github-open-source
  name: USAA Open Source GitHub Projects
  description: >-
    USAA maintains a small set of public open-source projects on GitHub focused
    on internal developer tooling and cybersecurity rather than published product
    APIs. Notable repositories include sonar-quality-gates (a Gradle plugin for
    enforcing Sonar quality gates), indexa (a Java dependency-artifact metadata
    analyzer), vogel (an actuarial machine-learning workflow tool), and a set of
    Assemblyline v4 security service integrations (Synapse, Hatching Triage,
    powerup-assemblyline). None of these projects expose USAA member data or a
    consumer-facing API; they are engineering and security tooling shared with
    the wider open-source community.
  humanURL: https://github.com/usaa
